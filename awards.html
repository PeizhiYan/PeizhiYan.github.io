<!DOCTYPE html>
<html lang="en">
<head>

  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-151616505-1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

  <title>Awards - Peizhi Yan</title>
  <link rel="apple-touch-icon" href="images/icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b4b9a">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/css/site.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
  <link rel="stylesheet" href="assets/css/gallery.css" />
  <link rel="stylesheet" href="assets/css/awards.css" />
</head>
<body>
  <div id="site-header"></div>

  <main id="main-content" class="gallery-main">
    <header class="gallery-intro">
      <h1>Awards</h1>
      <p>Honors and recognition.</p>
    </header>

    <section class="gallery-wall awards-wall" aria-label="Awards">
      <h2 class="wall-label">Governor General’s Academic Gold Medal</h2>
      <div class="hang">
        <figure class="artwork small" data-view="awards/view/credential.jpg" style="--ar: 810 / 600;">
          <div class="frame">
            <div class="liner">
              <div class="progressive-img"><img class="thumb" src="awards/thumbs/credential.jpg" alt="" /><img class="full" data-src="awards/wall/credential.jpg" alt="Medal credential" /></div>
            </div>
          </div>
          <figcaption class="placard">
            <span class="placard-title">Medal credential</span>
            <span class="placard-year">2019–2020</span>
          </figcaption>
        </figure>

        <figure class="artwork feature" data-frame="box" data-view="awards/view/medal.jpg" style="--ar: 574 / 451;">
          <div class="frame">
            <div class="liner">
              <div class="progressive-img"><img class="thumb" src="awards/thumbs/medal.jpg" alt="" /><img class="full" data-src="awards/wall/medal.jpg" alt="Governor General’s Academic Gold Medal" /></div>
            </div>
          </div>
          <figcaption class="placard brass">
            <span class="placard-title">Governor General’s Academic Gold Medal</span>
            <span class="placard-year">Graduate level · 2019–2020 · <a href="https://www.gg.ca/en/honours/recipients/116-108211">gg.ca</a></span>
          </figcaption>
        </figure>
      </div>

      <h2 class="wall-label">Scholarship</h2>
      <div class="hang">
        <figure class="artwork medium" data-view="awards/view/vector.jpg" style="--ar: 960 / 600;">
          <div class="frame">
            <div class="liner">
              <div class="progressive-img"><img class="thumb" src="awards/thumbs/vector.jpg" alt="" /><img class="full" data-src="awards/wall/vector.jpg" alt="Vector Scholarship in Artificial Intelligence" /></div>
            </div>
          </div>
          <figcaption class="placard">
            <span class="placard-title">Vector Scholarship in Artificial Intelligence</span>
            <span class="placard-year">Vector Institute, Toronto · 2018 · <a href="https://vectorinstitute.ai/2018/12/13/vector-awards-inaugural-scholarships-second-round-of-applications-to-open-in-2019/">vectorinstitute.ai</a></span>
          </figcaption>
        </figure>
      </div>

      <h2 class="wall-label">Reviewer Recognition</h2>
      <div class="hang">
        <figure class="artwork small" data-frame="doc" data-view="awards/view/cvpr2026.jpg" style="--ar: 772 / 600;">
          <div class="frame">
            <div class="liner">
              <div class="progressive-img"><img class="thumb" src="awards/thumbs/cvpr2026.jpg" alt="" /><img class="full" data-src="awards/wall/cvpr2026.jpg" alt="CVPR 2026" /></div>
            </div>
          </div>
          <figcaption class="placard">
            <span class="placard-title">CVPR 2026</span>
            <span class="placard-year">Reviewer recognition</span>
          </figcaption>
        </figure>

        <figure class="artwork small" data-frame="doc" data-view="awards/view/tpami2025.jpg" style="--ar: 850 / 600;">
          <div class="frame">
            <div class="liner">
              <div class="progressive-img"><img class="thumb" src="awards/thumbs/tpami2025.jpg" alt="" /><img class="full" data-src="awards/wall/tpami2025.jpg" alt="IEEE TPAMI" /></div>
            </div>
          </div>
          <figcaption class="placard">
            <span class="placard-title">IEEE TPAMI</span>
            <span class="placard-year">Reviewer certificate · 2025</span>
          </figcaption>
        </figure>

        <figure class="artwork small" data-frame="doc" data-view="awards/view/tvcg2025.jpg" style="--ar: 850 / 600;">
          <div class="frame">
            <div class="liner">
              <div class="progressive-img"><img class="thumb" src="awards/thumbs/tvcg2025.jpg" alt="" /><img class="full" data-src="awards/wall/tvcg2025.jpg" alt="IEEE TVCG" /></div>
            </div>
          </div>
          <figcaption class="placard">
            <span class="placard-title">IEEE TVCG</span>
            <span class="placard-year">Reviewer certificate · 2025</span>
          </figcaption>
        </figure>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/progressive-img.js"></script>
  <script src="assets/js/gallery-viewer.js"></script>
</body>
</html>
