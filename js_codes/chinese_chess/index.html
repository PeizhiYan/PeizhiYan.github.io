<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.7, maximum-scale=1.0, minimum-scale=0.7, user-scalable=0">
    <title>Chinese Chess 中国象棋</title>

    <script defer src="jquery-3.5.1.min.js"></script>
    <script defer src="book.js"></script>
    <script defer src="position.js"></script>
    <script defer src="search.js"></script>
    <script defer src="board.js"></script>
    <script defer src="cchess.js"></script>
    <script defer src="main.js"></script>
    <script>document.addEventListener('contextmenu', (x) => x.preventDefault(), false);</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg: #f1f5f9; --surface: #ffffff; --border: rgba(0,0,0,0.08);
        --text: #0f172a; --muted: #475569; --accent: #06b6d4;
        --radius: 16px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

      nav {
        position: sticky; top: 0; z-index: 100;
        background: rgba(241,245,249,0.88); backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
        padding: 0.7rem 1.25rem; display: flex; align-items: center; gap: 0.75rem;
      }
      nav h1 { flex: 1; text-align: center; font-size: 1rem; font-weight: 600; }
      .nav-btn {
        display: flex; align-items: center; gap: 0.35rem;
        padding: 0.4rem 0.85rem; border-radius: 99px; border: 1px solid rgba(0,0,0,0.1);
        background: rgba(0,0,0,0.05); color: var(--text);
        font-family: inherit; font-size: 0.82rem; font-weight: 600;
        text-decoration: none; cursor: pointer; transition: background 0.2s; white-space: nowrap;
      }
      .nav-btn:hover { background: rgba(0,0,0,0.1); }
      .nav-btn.legacy { color: var(--muted); font-weight: 400; }

      main { max-width: 680px; margin: 0 auto; padding: 1.5rem 1rem 3rem; display: flex; flex-direction: column; gap: 1rem; }

      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
      .card-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.9rem; }

      .controls-grid { display: flex; flex-wrap: wrap; gap: 1rem; }
      .ctrl-group { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; min-width: 160px; }
      .ctrl-label { font-size: 0.78rem; font-weight: 600; color: var(--muted); }
      select {
        padding: 0.5rem 0.75rem; border-radius: 8px; border: 1px solid var(--border);
        background: var(--bg); font-family: inherit; font-size: 0.88rem; color: var(--text);
        outline: none; cursor: pointer; transition: border-color 0.2s;
      }
      select:focus { border-color: var(--accent); }

      .btn-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.25rem; }
      .action-btn {
        padding: 0.6rem 1.4rem; border-radius: 10px; border: none;
        font-family: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer;
        transition: opacity 0.2s, transform 0.15s;
      }
      .action-btn.primary { background: var(--accent); color: #fff; }
      .action-btn.secondary { background: rgba(0,0,0,0.06); color: var(--text); border: 1px solid var(--border); }
      .action-btn:hover { opacity: 0.85; transform: translateY(-1px); }

      #message_area_84423 {
        min-height: 1.5rem; font-weight: 600; color: var(--accent); font-size: 0.95rem;
      }

      .board-wrapper {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 1rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        display: flex; justify-content: center;
        overflow-x: auto;
      }

      /* Move history — hidden by default, shown by JS */
      #move_history select { min-height: 100px; width: 100%; }

      footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <nav>
      <a class="nav-btn" href="https://PeizhiYan.github.io">&#127968; Home</a>
      <a class="nav-btn" href="../index.html">&#8592; Back</a>
      <h1>Chinese Chess 中国象棋</h1>
      <a class="nav-btn legacy" href="legacy.html">&#128196; Legacy</a>
    </nav>

    <main>
      <!-- Status message -->
      <div class="card" style="padding:0.75rem 1.25rem;">
        <div id="message_area_84423"></div>
      </div>

      <!-- Board -->
      <div class="board-wrapper">
        <span id="game_board">
          <div id="container"></div>
        </span>
      </div>

      <!-- Controls -->
      <div class="card">
        <div class="card-title">Game Settings</div>
        <div class="controls-grid">
          <div class="ctrl-group">
            <div class="ctrl-label">Mode</div>
            <select id="selMoveMode" size="1">
              <option selected value="0">Human First</option>
              <option value="1">Computer First</option>
              <option value="2">Human vs. Human</option>
            </select>
          </div>
          <div class="ctrl-group">
            <div class="ctrl-label">AI Skill Level</div>
            <select id="selLevel" size="1" onchange="level_change()">
              <option value="0.01">Newbie</option>
              <option value="0.1">Normal</option>
              <option selected value="1">Above Average</option>
              <option value="3">Expert</option>
              <option value="50">Master</option>
            </select>
          </div>
          <div class="ctrl-group">
            <div class="ctrl-label">Piece Theme</div>
            <select id="selTheme" size="1">
              <option selected value="0">Chinese Default</option>
              <option value="1">International</option>
            </select>
          </div>
          <div class="ctrl-group">
            <div class="ctrl-label">Board Style</div>
            <div class="btn-row" style="margin-top:0;">
              <button class="action-btn secondary" onclick="$('#container').css('background', 'url(images/board.jpg)')">Grass</button>
              <button class="action-btn secondary" onclick="$('#container').css('background', 'url(images/board_.jpg)')">Wood</button>
            </div>
          </div>
        </div>
        <div class="btn-row" style="margin-top:1rem;">
          <button class="action-btn primary" onclick="start_click()">&#9654; Start Game</button>
          <button class="action-btn secondary" onclick="retract_click()">&#8617; Undo Move</button>
        </div>
      </div>

      <!-- Move history (shown/hidden by game JS) -->
      <div class="card" id="move_history" style="display:none;">
        <div class="card-title">Move History</div>
        <select id="selMoveList" size="10" onchange="moveList_change()">
          <option selected value="0">=== Start ===</option>
        </select>
      </div>
    </main>

    <footer>&copy; 2018–2026 Peizhi Yan. All rights reserved.</footer>
  </body>
</html>
