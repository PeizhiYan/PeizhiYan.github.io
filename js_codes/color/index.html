<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Selector</title>
  <script src="script.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9; --surface: #ffffff; --border: rgba(0,0,0,0.08);
      --text: #0f172a; --muted: #475569; --accent: #22c55e;
      --accent-soft: rgba(34,197,94,0.08); --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(241,245,249,0.88); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0.7rem 1.25rem; display: flex; align-items: center; gap: 0.75rem;
    }
    nav h1 { flex: 1; text-align: center; font-size: 1rem; font-weight: 600; }
    .nav-btn {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0.4rem 0.85rem; border-radius: 99px; border: 1px solid rgba(0,0,0,0.1);
      background: rgba(0,0,0,0.05); color: var(--text);
      font-family: inherit; font-size: 0.82rem; font-weight: 600;
      text-decoration: none; cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }
    .nav-btn:hover { background: rgba(0,0,0,0.1); }
    .nav-btn.legacy { color: var(--muted); font-weight: 400; }

    main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1rem 3rem; display: flex; flex-direction: column; gap: 1.25rem; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .card-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 1rem; }

    .controls { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .controls label { font-size: 0.88rem; font-weight: 600; color: var(--muted); }
    .step-input {
      padding: 0.45rem 0.75rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); font-family: inherit; font-size: 0.9rem; color: var(--text);
      width: 80px; outline: none; transition: border-color 0.2s;
    }
    .step-input:focus { border-color: var(--accent); }
    .gen-btn {
      padding: 0.5rem 1.25rem; border-radius: 10px; border: none;
      background: var(--accent); color: #fff;
      font-family: inherit; font-size: 0.88rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .gen-btn:hover { opacity: 0.85; transform: translateY(-1px); }

    .picked-display {
      padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); font-family: 'Courier New', monospace;
      font-size: 1rem; font-weight: 600; color: var(--accent);
      min-height: 2.75rem;
    }

    #tuning, #color_chart { margin-top: 0.5rem; }

    .button {
      border: none; border-radius: 4px;
      padding: 14px 22px; margin: 3px 2px;
      display: inline-block; cursor: pointer;
    }

    footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav>
    <a class="nav-btn" href="https://PeizhiYan.github.io">&#127968; Home</a>
    <a class="nav-btn" href="../index.html">&#8592; Back</a>
    <h1>Color Selector</h1>
    <a class="nav-btn legacy" href="legacy.html">&#128196; Legacy</a>
  </nav>

  <main>
    <div class="card">
      <div class="card-title">Settings</div>
      <div class="controls">
        <label for="step">Step size</label>
        <textarea id="step" class="step-input" style="height:2rem;resize:none;padding:0.3rem 0.6rem;">10</textarea>
        <button class="gen-btn" onclick="generate()">Generate Chart</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Selected Color</div>
      <div class="picked-display" id="picked"></div>
    </div>

    <div class="card">
      <div class="card-title">Fine Tuning</div>
      <div id="tuning"></div>
    </div>

    <div class="card">
      <div class="card-title">Color Chart</div>
      <div id="color_chart"></div>
    </div>
  </main>

  <footer>&copy; 2018–2026 Peizhi Yan. All rights reserved.</footer>
</body>
</html>
