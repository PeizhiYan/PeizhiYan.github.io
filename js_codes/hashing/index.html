<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hashing Tools</title>
  <script src="jquery.min.js"></script>
  <script src="md5.js"></script>
  <script>
    function toMD5() {
      var s = document.getElementById("inputText").value;
      var h = $.md5(s);
      document.getElementById("outputHash").textContent = h;
    }
    function copyResult() {
      var t = document.getElementById("outputHash").textContent;
      if (!t || t === "—") return;
      navigator.clipboard.writeText(t).then(function() {
        var btn = document.getElementById("copyBtn");
        btn.textContent = "Copied!";
        setTimeout(function() { btn.textContent = "Copy"; }, 1500);
      });
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9; --surface: #ffffff; --border: rgba(0,0,0,0.08);
      --text: #0f172a; --muted: #475569; --accent: #f97316;
      --accent-soft: rgba(249,115,22,0.08); --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(241,245,249,0.88); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0.7rem 1.25rem; display: flex; align-items: center; gap: 0.75rem;
    }
    nav h1 { flex: 1; text-align: center; font-size: 1rem; font-weight: 600; }
    .nav-btn {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0.4rem 0.85rem; border-radius: 99px; border: 1px solid rgba(0,0,0,0.1);
      background: rgba(0,0,0,0.05); color: var(--text);
      font-family: inherit; font-size: 0.82rem; font-weight: 600;
      text-decoration: none; cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }
    .nav-btn:hover { background: rgba(0,0,0,0.1); }
    .nav-btn.legacy { color: var(--muted); font-weight: 400; }

    main { max-width: 640px; margin: 0 auto; padding: 2.5rem 1rem 3rem; display: flex; flex-direction: column; gap: 1.25rem; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .card-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 1rem; }

    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
    textarea {
      width: 100%; padding: 0.75rem 1rem; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg);
      font-family: 'Outfit', monospace; font-size: 0.95rem; color: var(--text);
      resize: vertical; min-height: 120px; outline: none; transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--accent); }

    .algo-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .hash-btn {
      padding: 0.6rem 1.25rem; border-radius: 10px; border: none;
      background: var(--accent); color: #fff;
      font-family: inherit; font-size: 0.88rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .hash-btn:hover { opacity: 0.88; transform: translateY(-1px); }

    .result-area { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.5rem; }
    .hash-output {
      flex: 1; padding: 0.75rem 1rem; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border);
      font-family: 'Courier New', monospace; font-size: 0.9rem; color: var(--accent);
      word-break: break-all; min-height: 2.75rem;
    }
    .copy-btn {
      padding: 0.55rem 1rem; border-radius: 10px; border: 1px solid var(--border);
      background: rgba(0,0,0,0.04); color: var(--muted);
      font-family: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: all 0.2s;
    }
    .copy-btn:hover { background: rgba(0,0,0,0.08); }

    footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav>
    <a class="nav-btn" href="https://PeizhiYan.github.io">&#127968; Home</a>
    <a class="nav-btn" href="../index.html">&#8592; Back</a>
    <h1>Hashing Tools</h1>
    <a class="nav-btn legacy" href="legacy.html">&#128196; Legacy</a>
  </nav>

  <main>
    <div class="card">
      <div class="card-title">Input</div>
      <label for="inputText">Text to hash</label>
      <textarea id="inputText" placeholder="Type or paste your text here…"></textarea>
      <div class="algo-row">
        <button class="hash-btn" onclick="toMD5()">MD5</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Result</div>
      <div class="result-area">
        <div class="hash-output" id="outputHash">—</div>
        <button class="copy-btn" id="copyBtn" onclick="copyResult()">Copy</button>
      </div>
    </div>
  </main>

  <footer>&copy; 2018–2026 Peizhi Yan. All rights reserved.</footer>
</body>
</html>
